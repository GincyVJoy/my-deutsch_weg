C['m7-t5']={l:["Pets: **der Hund, die Katze, der Vogel, der Fisch, das Kaninchen** (rabbit), **das Meerschweinchen, das Pferd.** *Ich habe einen Hund. Er heißt Max und ist drei Jahre alt. Er spielt gern im Park.*","Care: **füttern** (feed), **Gassi gehen** (walk the dog), **der Tierarzt** (vet), **die Impfung, das Futter, die Leine** (lead), **die Hundesteuer** (dog tax). *Ich muss mit dem Hund zum Tierarzt.*","Rules: **Haustiere erlaubt / nicht erlaubt** in rented flats; **Leinenpflicht** (leash required). *Dürfen wir einen Hund in der Wohnung halten?*","Wild animals: **der Fuchs, das Reh, der Igel, der Bär, der Wolf, der Adler, die Biene.**"],

C['m7-t6']={l:["Big numbers: **100** hundert · **101** hunderteins · **200** zweihundert · **1.000** tausend · **2.500** zweitausendfünfhundert · **1.000.000** eine Million. Germans use a **dot** for thousands and a **comma** for decimals: *1.250,50 €* is *tausendzweihundertfünfzig Euro fünfzig*.","Years: **1999** neunzehnhundertneunundneunzig · **2026** zweitausendsechsundzwanzig. Say *im Jahr 2026* or just *2026*; *seit 2020*; *vor drei Jahren*.","Ordinals: **der erste, zweite, dritte, vierte, fünfte, sechste, siebte, achte, neunte, zehnte … neunzehnte** (add **-te**), from 20: **zwanzigste, einundzwanzigste** (add **-ste**). Irregular: **erste, dritte, siebte, achte.** *Heute ist der dritte November. Am ersten Mai.*","Dates and parts: **am 3.11.** is *am dritten November*; **die Hälfte** (half), **ein Drittel, ein Viertel**; **50 Prozent.**"],

C['m7-g1']={l:["**dieser / diese / dieses** (this) declines like **der**: Nom **dieser, diese, dieses, diese** · Akk **diesen, diese, dieses, diese** · Dat **diesem, dieser, diesem, diesen** · Gen **dieses, dieser, dieses, dieser**. *Dieser Mann ist mein Chef. Ich nehme dieses Buch.*","**jener** (that over there) sounds formal or literary. In speech use **der / die / das da** or **dort**: *Das Haus da gehört meinem Onkel.* **solcher** (such): *Solche Fehler passieren.*","**welcher / welche / welches** (which) also declines like der: *Welchen Tee möchten Sie? Welche Farbe gefällt dir?* **was für ein(e)** (what kind of) declines like *ein* and does not ask for a choice: *Was für ein Auto hast du?* — *Ein kleines rotes.*","Pointing: **dieser hier, der da, den hier.** *Ich nehme den hier.* The pronoun **der / die / das** can stress: *Den kenne ich nicht.* (I don’t know him)"],
 w:["dieser|this","jener|that (over there)","solcher|such","welcher|which","was für ein|what kind of","da|there"],
 q:["Ich nehme ___ Buch. (this)|dieses|dieser|diesen","___ Tee möchten Sie? (which, masc. Akk)|Welchen|Welcher|Welches","“Was für ein Auto hast du?” asks…|what kind of car|which car of these two|how many cars"]};
C['m7-g2']={l:["**man** (one, you, people) takes the er-form: *Man darf hier nicht parken.* **jemand** (someone) and **niemand** (no one): *Ist jemand da? Niemand hat angerufen.* Akk **jemanden / niemanden**, Dat **jemandem / niemandem**.","**etwas** (something), **nichts** (nothing), **alles** (everything) with a capitalised adjective: *etwas Neues, nichts Besonderes, alles Gute.* **viel / wenig**: *viel Zeit, wenig Geld.*","**irgend-** (some … or other): **irgendwo** (somewhere), **irgendwann** (sometime), **irgendwie** (somehow), **irgendjemand, irgendetwas**: *Hast du irgendwo meinen Schlüssel gesehen?* Negatives: **nirgends** (nowhere), **nie / niemals**, **keiner / keine / keines** (none).","**jeder, alle, manche, einige, mehrere, beide**: *Jeder Mensch ist anders. Alle Kinder spielen. Manche Leute mögen Regen.* **jeder** is singular, **alle** is plural."],
 w:["man|one, you","jemand|someone","niemand|no one","irgendwo|somewhere","nirgends|nowhere","manche|some"],
 q:["___ darf hier nicht parken. (one)|Man|Mann|Jemand","Hast du ___ meinen Schlüssel gesehen? (somewhere)|irgendwo|nirgends|überall","“niemand” means…|no one|someone|everyone"]};
C['m7-g3']={l:["**um … zu** gives a **purpose** (in order to) when **both parts have the same subject**: *Ich lerne Deutsch, um in Deutschland zu arbeiten. · Er geht zum Bäcker, um Brot zu kaufen. · Wir fahren nach Berlin, um Freunde zu besuchen.*","Structure: **main clause + comma + um + rest + zu + infinitive**. **zu** stands directly before the infinitive; with separable verbs it goes between prefix and verb: *Ich stelle einen Wecker, um früh aufzustehen. Er ruft an, um einen Termin zu vereinbaren.*","**damit** is used when the **subjects differ**, and the verb goes last: *Ich spreche langsam, damit du mich verstehst.* Compare: *Ich lerne, um die Prüfung zu bestehen.* (same subject) with *Ich lerne mit dir, damit du die Prüfung bestehst.* (different subjects)","Negative and related forms: **um … nicht zu**: *Ich gehe früh los, um nicht zu spät zu kommen.* · **ohne … zu** (without): *Er ging, ohne zu grüßen.* · **(an)statt … zu** (instead of): *Statt zu lernen, schläft sie.* · Question **Wozu?** (what for?) — *Wozu lernst du Deutsch? — Um hier zu arbeiten.*"],
 w:["um … zu|in order to","damit|so that","wozu|what for","der Zweck|purpose","ohne … zu|without doing","statt … zu|instead of doing"],
 q:["Ich lerne Deutsch, ___ in Deutschland zu arbeiten.|um|damit|dass","Ich spreche langsam, ___ du mich verstehst.|damit|um|weil","Wozu lernst du Deutsch? — ___ hier zu arbeiten.|Um|Weil|Damit","Ich stelle einen Wecker, um früh ___.|aufzustehen|zu aufstehen|aufstehen"]};
C['m7-g4']={l:["**je … desto / umso** + comparative (the more … the more): *Je mehr du übst, desto besser wirst du. Je älter ich werde, umso ruhiger bin ich.* The **je**-clause has the verb last; after **desto** the verb is in position 2.","**als ob / als wenn** (as if) + Konjunktiv II: *Er tut so, als ob er alles wüsste. Es sieht aus, als ob es regnen würde.* Variant: *Es sieht aus, als würde es regnen.*","**ohne dass / (an)statt dass** when the subjects differ: *Er ging, ohne dass jemand es merkte. Statt dass er hilft, sitzt er nur da.* Same subject → **ohne … zu / statt … zu**.","More: **sodass** (so that, result): *Es regnete stark, sodass wir zu Hause blieben.* · **falls** (in case): *Falls du Zeit hast, ruf mich an.* · **indem** (by doing): *Man lernt Deutsch, indem man viel spricht.*"],
 w:["je … desto|the more … the more","als ob|as if","ohne dass|without (different subject)","anstatt dass|instead of (different subject)","falls|in case","indem|by (doing)"],
 q:["Je mehr du übst, ___ besser wirst du.|desto|dass|je","Er tut so, als ob er alles ___. (wissen)|wüsste|weiß|wusste","Man lernt Deutsch, ___ man viel spricht.|indem|damit|obwohl"]};
C['m7-g5']={l:["**lassen** has three main meanings. 1) **to allow**: *Er lässt die Kinder spielen. Lass mich in Ruhe!* 2) **to leave behind**: *Ich lasse den Schlüssel zu Hause.* 3) **to have something done**: *Ich lasse mein Auto reparieren. Sie lässt sich die Haare schneiden.*","Forms: ich lasse, du lässt, er lässt, wir lassen, ihr lasst, sie lassen · Präteritum **ließ** · Perfekt **hat gelassen** (main verb) or **hat … lassen** with another verb (double infinitive): *Ich habe den Schlüssel gelassen. Ich habe mein Auto reparieren lassen.*","**sich lassen + infinitive** can replace the passive with *können*: *Das lässt sich leicht erklären.* (= Das kann leicht erklärt werden.) *Die Tür lässt sich nicht öffnen.*","Imperative: **Lass / Lasst / Lassen Sie…**: *Lass uns gehen! Lassen Sie mich bitte durch.*"],
 w:["lassen|to let, leave","reparieren lassen|to have repaired","sich lassen|can be …ed","Lass uns…|let’s…","in Ruhe lassen|to leave alone","zurücklassen|to leave behind"],
 q:["Ich ___ mein Auto reparieren. (have done)|lasse|lass|lässt","Er ___ die Kinder spielen. (lets)|lässt|lasst|lasse","Perfekt: Ich habe mein Auto reparieren ___.|lassen|gelassen|lasse"]};
C['m7-g6']={l:["**Compound nouns**: German joins nouns, and the **last part decides gender and plural**: *der Kühlschrank (kühl + der Schrank), die Haustür (das Haus + die Tür), das Wohnzimmer.* Often a joining letter appears: **-s-, -n-, -e-**: *die Arbeit → der Arbeitsvertrag, die Küche → der Küchentisch.*","Noun endings: **-ung, -heit, -keit, -schaft, -ion, -tät** → all **die** (*die Zeitung, die Freiheit, die Möglichkeit, die Freundschaft, die Information, die Qualität*). **-er, -ist, -ismus** → usually **der**. **-chen, -lein** → **das** (*das Mädchen*).","Verb to noun: **das Essen, das Lernen** (infinitive as neuter noun) · **der Anruf** (anrufen) · **die Hilfe** (helfen) · **der Besuch** (besuchen) · **die Entscheidung** (entscheiden).","Adjective endings: **un-** (opposite): *unfreundlich* · **-los** (without): *arbeitslos* · **-voll** (full of): *sinnvoll* · **-bar** (able to be): *machbar* · **-lich / -ig**: *freundlich, wichtig*"],
 w:["das Kompositum|compound noun","die Endung|ending","die Vorsilbe|prefix","die Nachsilbe|suffix","zusammengesetzt|compound","das Wort|word"],
 q:["In a compound noun the gender comes from the…|last part|first part|longest part","Nouns ending in -ung are…|die|der|das","arbeitslos means…|without work|full of work|able to work"]};
C['m7-g7']={l:["**Modal particles** colour a sentence and have no direct translation. They are very common in speech: **doch, mal, ja, eben, halt, denn, eigentlich, schon, wohl, aber, bloß.**","**mal** softens a request: *Komm mal her! Kannst du mir mal helfen?* · **doch** encourages or contradicts: *Komm doch mit! Das ist doch klar!* · **ja** = as you know, or surprise: *Das ist ja toll!* · **denn** shows interest in questions: *Wie geht’s dir denn?*","**eben / halt** = that’s just how it is: *Das ist eben so.* · **eigentlich** = actually: *Was machst du eigentlich beruflich?* · **schon** = reassurance: *Das wird schon klappen.* · **aber** = surprise: *Das ist aber schön!*","Use them in informal speech and leave them out of formal writing. They stand in the middle of the sentence, after the verb and pronouns: *Kannst du mir bitte mal helfen?*"],
 w:["doch|after all, but","mal|just, once","ja|you know, indeed","eben|just (that’s how it is)","halt|just (colloquial)","eigentlich|actually"],
 q:["Kannst du mir ___ helfen? (softens the request)|mal|ja|eben","“Komm doch mit!” sounds…|encouraging|angry|formal","Modal particles are mostly used in…|informal speech|formal letters|legal texts"]};

const wordScore=(t,hd)=>{const tw=normA(t).split(' ').filter(Boolean),hw=normA(hd).split(' ');return tw.length?tw.filter(w=>hw.indexOf(w)>=0).length/tw.length:0};

const fold=s=>s.toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'s');

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

let IDX=null;
function buildIdx(){if(IDX)return IDX;IDX=[];MODS.forEach(m=>chaptersOf(m).forEach(c=>{const k=C[c.id];if(!k)return;IDX.push({id:c.id,m:m.id,lv:m.lv,title:c.title,kind:c.kind,paras:k.l.map(plain),words:k.w.map(x=>x.split('|'))})}));return IDX;}
function snipHtml(p,i,len,q){const st=Math.max(0,i-70),en=Math.min(p.length,i+len+120);return hlHtml(esc((st>0?'… ':'')+p.slice(st,en)+(en<p.length?' …':'')),q);}

  e.paras.forEach(p=>{const r=findRx(re,fold(p));if(r){score++;if(sn.length<3)sn.push(snipHtml(p,r.i,r.l,q))}});

/* ===================== APP ===================== */
function App(){

 const [view,setView]=useState('home'),[init,setInit]=useState(null),[sq,setSq]=useState(''),[vsel,setVsel]=useState(null);

  h('main',{className:'main'},

   view==='home'?h(Home,{P,go,open,reset,search}):view==='learn'?h(Learn,{key:init?init.k:'x',P,upd,init}):view==='search'?h(Search,{q:sq,setQ:setSq,open,openVerb}):view==='nouns'?h(Nouns,{P,upd}):view==='verbs'?h(Verbs,{key:vsel||'v',upd,sel:vsel}):h(Exams,{P,upd})));
